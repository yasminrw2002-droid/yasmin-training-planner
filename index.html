<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yasmin Training Planner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
<h1>Yasmin Training Planner</h1>
<div class="card">
<h2>Fortnight Start Date</h2>
<input type="date" id="startDate">
<button onclick="generatePlan()">Generate Plan</button>
</div>
<div class="card">
<h2>Daily Targets</h2>
<ul>
<li>Calories: 2200 kcal</li>
<li>Protein: 130g</li>
<li>Water: 2.5-3L</li>
<li>Steps: 7000-9000</li>
<li>Sleep: 7-9 hours</li>
</ul>
</div>
<div id="plan"></div>
</div>
<script src="exercises.js"></script>
<script src="script.js"></script>
</body>
</html>
